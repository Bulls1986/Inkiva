<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" role="img" aria-labelledby="title desc">
  <title id="title">Inkiva Markdown document</title>
  <desc id="desc">A Markdown document icon with the Inkiva 04 mark.</desc>
  <defs>
    <linearGradient id="paper" x1="18" y1="8" x2="166" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#F8FAFD" />
    </linearGradient>
    <linearGradient id="inkiva-dark" x1="38" y1="190" x2="88" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111419" />
      <stop offset="1" stop-color="#454A53" />
    </linearGradient>
    <linearGradient id="inkiva-blue" x1="91" y1="190" x2="142" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A98FF" />
      <stop offset="1" stop-color="#2859D5" />
    </linearGradient>
  </defs>

  <!-- Markdown document silhouette with the familiar folded corner. -->
  <path
    d="M16 4h108l48 48v176c0 5.52-4.48 10-10 10H16c-5.52 0-10-4.48-10-10V14C6 8.48 10.48 4 16 4Z"
    fill="url(#paper)"
    stroke="#C9D0DC"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <path d="M124 4v48h48" fill="#E9EDF4" stroke="#C9D0DC" stroke-width="3" stroke-linejoin="round" />
  <path d="M124 4v48h48" fill="#F8FAFD" stroke="#C9D0DC" stroke-width="3" stroke-linejoin="round" />

  <!-- A # heading and simple text lines identify the file as Markdown. -->
  <g fill="#69727F">
    <rect x="25" y="35" width="4" height="28" rx="2" />
    <rect x="36" y="35" width="4" height="28" rx="2" />
    <rect x="20" y="42" width="25" height="4" rx="2" />
    <rect x="20" y="52" width="25" height="4" rx="2" />
  </g>
  <g fill="#8C96A5">
    <rect x="56" y="39" width="73" height="6" rx="3" />
    <rect x="56" y="52" width="51" height="6" rx="3" />
    <rect x="20" y="77" width="140" height="6" rx="3" />
    <rect x="20" y="90" width="140" height="6" rx="3" />
  </g>
  <g fill="#69727F">
    <circle cx="24" cy="111" r="3" />
    <circle cx="24" cy="123" r="3" />
    <circle cx="24" cy="135" r="3" />
  </g>
  <g fill="#8C96A5">
    <rect x="34" y="108" width="126" height="6" rx="3" />
    <rect x="34" y="120" width="98" height="6" rx="3" />
    <rect x="34" y="132" width="126" height="6" rx="3" />
  </g>

  <!-- Smaller Inkiva 04 mark, kept proportional and anchored at bottom-right. -->
  <g transform="translate(82 119) scale(0.5142857)">
    <rect x="20" y="151" width="140" height="64" rx="14" fill="#F1F4F9" stroke="#D4DBE6" stroke-width="3" />
    <path
      d="M45 169c-3-1-6 1-6 5v27c0 4 3 6 6 5l46-18v-7l-46-18Z"
      fill="url(#inkiva-dark)"
    />
    <path
      d="M135 169c3-1 6 1 6 5v27c0 4-3 6-6 5l-46-18v-7l46-18Z"
      fill="url(#inkiva-blue)"
    />
    <rect x="84" y="173" width="12" height="25" rx="6" fill="#FFFFFF" />
  </g>
</svg>
