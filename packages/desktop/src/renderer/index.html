<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Inkiva</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                  script-src 'self';
                  style-src 'self' 'unsafe-inline';
                  img-src * data: file:;
                  font-src 'self' data:;
                  "
    />
    <script src="/initial-appearance.js"></script>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #ffffff;
      }

      .inkiva-bootstrap {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: rgba(0, 0, 0, 0.55);
        background: #ffffff;
        opacity: 0;
        visibility: hidden;
        animation: inkiva-bootstrap-reveal 1ms linear 500ms forwards;
      }

      .inkiva-bootstrap__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .inkiva-bootstrap__loader {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 8px;
      }

      .inkiva-bootstrap__dot {
        display: block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.35;
        animation: inkiva-bootstrap-dot 900ms ease-in-out infinite;
      }

      .inkiva-bootstrap__dot:nth-child(2) {
        animation-delay: 120ms;
      }

      .inkiva-bootstrap__dot:nth-child(3) {
        animation-delay: 240ms;
      }

      .inkiva-bootstrap__text {
        font-size: 13px;
        letter-spacing: 0.2px;
      }

      @media (prefers-color-scheme: dark) {
        body,
        .inkiva-bootstrap {
          background: #1e1e1e;
          color: rgba(255, 255, 255, 0.62);
        }
      }

      html[data-inkiva-appearance='light'] body,
      html[data-inkiva-appearance='light'] .inkiva-bootstrap {
        background: #ffffff;
        color: rgba(0, 0, 0, 0.55);
      }

      html[data-inkiva-appearance='dark'] body,
      html[data-inkiva-appearance='dark'] .inkiva-bootstrap {
        background: #1b1d21;
        color: rgba(255, 255, 255, 0.62);
      }

      html[data-inkiva-appearance='paper'] body,
      html[data-inkiva-appearance='paper'] .inkiva-bootstrap {
        background: #fffdf8;
        color: rgba(46, 43, 39, 0.62);
      }

      @keyframes inkiva-bootstrap-dot {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes inkiva-bootstrap-reveal {
        to {
          opacity: 1;
          visibility: visible;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .inkiva-bootstrap__dot {
          animation: none;
          opacity: 0.6;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="inkiva-bootstrap" role="status" aria-live="polite" aria-label="Inkiva loading">
        <div class="inkiva-bootstrap__content">
          <div class="inkiva-bootstrap__loader" aria-hidden="true">
            <span class="inkiva-bootstrap__dot"></span>
            <span class="inkiva-bootstrap__dot"></span>
            <span class="inkiva-bootstrap__dot"></span>
          </div>
          <div class="inkiva-bootstrap__text">Inkiva</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
