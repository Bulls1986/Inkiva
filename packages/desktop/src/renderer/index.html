<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Inkiva</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                  script-src 'self';
                  style-src 'self' 'unsafe-inline';
                  img-src * data: file:;
                  font-src 'self' data:;
                  "
    />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #ffffff;
      }

      .inkiva-bootstrap {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: rgba(0, 0, 0, 0.55);
        background: #ffffff;
      }

      .inkiva-bootstrap__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .inkiva-bootstrap__mark {
        width: 28px;
        height: 28px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        opacity: 0.55;
        animation: inkiva-bootstrap-spin 0.8s linear infinite;
      }

      .inkiva-bootstrap__text {
        font-size: 13px;
        letter-spacing: 0.2px;
      }

      @media (prefers-color-scheme: dark) {
        body,
        .inkiva-bootstrap {
          background: #1e1e1e;
          color: rgba(255, 255, 255, 0.62);
        }
      }

      @keyframes inkiva-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="inkiva-bootstrap" aria-label="Inkiva loading">
        <div class="inkiva-bootstrap__content">
          <div class="inkiva-bootstrap__mark"></div>
          <div class="inkiva-bootstrap__text">Inkiva</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
