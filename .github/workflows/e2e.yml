name: E2E Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # A wedged Electron close/renderer handshake must fail the job instead of
    # consuming a runner indefinitely. The suite normally completes in about
    # five minutes on this runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Run E2E Tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      # The visual suite is intentionally strict. When a reference layout
      # changes, capture the candidate images in CI so the reviewer can
      # inspect the actual browser output before accepting the new baseline.
      - name: Generate candidate desktop snapshots
        if: failure()
        continue-on-error: true
        run: xvfb-run --auto-servernum pnpm exec playwright test visual-regression.spec.ts --config=test/e2e/playwright.config.ts --update-snapshots

      - name: Upload candidate desktop snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-snapshots
          path: packages/desktop/test/e2e/visual-regression.spec.ts-snapshots
          if-no-files-found: ignore

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-performance-reports
          path: packages/desktop/test-results/perf-results
          if-no-files-found: ignore

      - name: Upload desktop E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-test-results
          path: packages/desktop/test-results
          if-no-files-found: ignore
