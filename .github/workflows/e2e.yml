name: E2E Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # This is the desktop electron Playwright suite. packages/muya has its
    # own e2e under packages/muya/e2e/ wired via muya-e2e.yml.
    paths-ignore:
      - 'packages/muya/**'
      # Documentation-only PR updates do not need desktop build/test/E2E work.
      # Keep fixture Markdown outside these narrow documentation patterns.
      - 'docs/**'
      - '*.md'
      - '**/README.md'
      - '**/README.*.md'
      - '**/CHANGELOG.md'
      - '**/CHANGELOG.*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    # A wedged Electron close/renderer handshake must fail the job instead of
    # consuming a runner indefinitely. The suite normally completes in about
    # five minutes on this runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64
          sudo apt-get install -y fonts-noto-cjk

      - uses: ./.github/actions/setup

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      # Temporary capture-only path on the v0.5 baseline branch.
      # Candidate images are uploaded for review, not accepted in the repo.
      - name: Capture v0.5 visual candidates for review
        if: github.head_ref == 'chore/v05-visual-baseline'
        run: |
          xvfb-run --auto-servernum pnpm --filter inkiva exec playwright test test/e2e/visual-regression.spec.ts --config=test/e2e/playwright.config.ts --update-snapshots

      - name: Upload unapproved v0.5 visual candidates
        if: always() && github.head_ref == 'chore/v05-visual-baseline'
        uses: actions/upload-artifact@v4
        with:
          name: v05-visual-candidate-snapshots
          path: packages/desktop/test/e2e/visual-regression.spec.ts-snapshots/*.png
          if-no-files-found: error

      - name: Run E2E Tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-failure-artifacts
          path: packages/desktop/test-results
          if-no-files-found: ignore

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-performance-reports
          path: packages/desktop/test-results/perf-results
          if-no-files-found: ignore
