name: Release Inkiva

on:
  push:
    # Broad trigger so the validate job can reject malformed v-tags
    # (e.g. `vbad.tag`) instead of them silently not triggering anything.
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # SemVer 2.0.0 with leading "v"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid semver (expected vX.Y.Z[-prerelease][+build])"
            exit 1
          fi
          echo "Tag '$tag' is valid."

  build:
    name: Build (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Publish the currently supported release targets.
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4.3.1

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Cache Electron binary; key on package.json so it busts when Electron version changes.
      - name: Cache Electron binary
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      # Must be set before postinstall runs electron-rebuild
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'

      # Mac builds are unsigned (no Developer ID); see release notes for the
      # user-side xattr/codesign workaround. Per-arch script: electron-builder's
      # --arm64/--x64 flags are additive over the config's arch list, so
      # electron-builder.yml must not pin mac.target arches for the flag to
      # actually restrict the build to a single arch.
      #
      # dmgbuild occasionally fails on GitHub-hosted macOS runners after the
      # DMG has already been created because hdiutil cannot immediately detach
      # its temporary device ("Resource busy"). Retry only that known transient
      # failure; deterministic compile/package errors still fail immediately.
      - name: build-mac
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            pnpm run build:mac:${{ matrix.arch }} 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}

            if [[ $status -eq 0 ]]; then
              rm -f "$log_file"
              exit 0
            fi

            if ! grep -Eq 'Unable to detach device cleanly|Resource busy' "$log_file"; then
              rm -f "$log_file"
              exit "$status"
            fi

            if [[ $attempt -eq 3 ]]; then
              echo "::error::macOS DMG detach remained busy after $attempt attempts."
              rm -f "$log_file"
              exit "$status"
            fi

            echo "::warning::Transient macOS DMG detach failure; retrying build (attempt $((attempt + 1))/3)."
            rm -f "$log_file"
            sleep $((attempt * 5))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: inkiva-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Per-job permissions REPLACE workflow-level ones, so re-declare
    # both: contents:write to publish the release, actions:read for
    # download-artifact's Actions API calls.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4.3.1

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      # Keep each uploaded platform artifact in its own directory. Each macOS
      # build writes a same-named latest-mac.yml, so those files must be merged
      # explicitly before the release is assembled.
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifact-downloads

      - name: Assemble release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          find artifact-downloads -type f ! -name 'latest-mac.yml' -exec cp -- {} dist/ \;

      - name: Merge macOS updater metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises'
          import path from 'node:path'

          const scalar = (value) => value.trim().replace(/^['"]|['"]$/g, '')

          const walk = async (directory) => {
            const entries = await readdir(directory, { withFileTypes: true })
            const files = []
            for (const entry of entries) {
              const entryPath = path.join(directory, entry.name)
              if (entry.isDirectory()) files.push(...await walk(entryPath))
              else files.push(entryPath)
            }
            return files
          }

          const parseMetadata = (filename, source) => {
            const versionMatch = source.match(/^version:\s*(.+?)\s*$/m)
            if (!versionMatch) throw new Error(`${filename} is missing a version`)

            const lines = source.split(/\r?\n/)
            const files = []
            for (let index = 0; index < lines.length; index += 1) {
              const urlMatch = lines[index].match(/^\s*-\s+url:\s*(.+?)\s*$/)
              if (!urlMatch) continue
              let sha512
              let size
              for (let next = index + 1; next < lines.length; next += 1) {
                if (/^\s*-\s+url:\s*/.test(lines[next])) break
                const shaMatch = lines[next].match(/^\s+sha512:\s*(.+?)\s*$/)
                if (shaMatch) sha512 = scalar(shaMatch[1])
                const sizeMatch = lines[next].match(/^\s+size:\s*(\d+)\s*$/)
                if (sizeMatch) size = Number(sizeMatch[1])
              }
              if (!sha512) throw new Error(`${filename} has a file entry without sha512 metadata`)
              files.push({ url: scalar(urlMatch[1]), sha512, ...(size === undefined ? {} : { size }) })
            }
            if (!files.length) throw new Error(`${filename} has no file entries`)
            return {
              version: scalar(versionMatch[1]),
              files,
              releaseDate: source.match(/^releaseDate:\s*(.+?)\s*$/m)?.[1]
            }
          }

          const metadataFiles = (await walk('artifact-downloads'))
            .filter((filename) => path.basename(filename) === 'latest-mac.yml')
          if (metadataFiles.length !== 2) {
            throw new Error(`Expected exactly two macOS updater metadata files, found ${metadataFiles.length}`)
          }

          const metadata = await Promise.all(
            metadataFiles.map(async (filename) => parseMetadata(filename, await readFile(filename, 'utf8')))
          )
          const version = metadata[0].version
          if (metadata.some((item) => item.version !== version)) {
            throw new Error('macOS updater metadata files describe different versions')
          }

          const entriesByUrl = new Map()
          for (const item of metadata) {
            for (const entry of item.files) {
              const existing = entriesByUrl.get(entry.url)
              if (existing && (existing.sha512 !== entry.sha512 || existing.size !== entry.size)) {
                throw new Error(`Conflicting macOS updater metadata for ${entry.url}`)
              }
              entriesByUrl.set(entry.url, entry)
            }
          }

          const entries = [...entriesByUrl.values()].sort((left, right) => {
            const leftIsZip = left.url.endsWith('.zip')
            const rightIsZip = right.url.endsWith('.zip')
            if (leftIsZip !== rightIsZip) return leftIsZip ? -1 : 1
            return left.url.localeCompare(right.url)
          })
          for (const required of [`inkiva-mac-x64-${version}.zip`, `inkiva-mac-arm64-${version}.zip`]) {
            if (!entriesByUrl.has(required)) throw new Error(`Merged metadata is missing ${required}`)
          }

          const first = entries[0]
          const output = [
            `version: ${version}`,
            'files:',
            ...entries.flatMap(({ url, sha512, size }) => [
              `  - url: ${url}`,
              `    sha512: ${sha512}`,
              ...(size === undefined ? [] : [`    size: ${size}`])
            ]),
            `path: ${first.url}`,
            `sha512: ${first.sha512}`,
            ...(metadata[0].releaseDate ? [`releaseDate: ${scalar(metadata[0].releaseDate)}`] : []),
            ''
          ].join('\n')
          await writeFile('dist/latest-mac.yml', output)
          NODE

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          # Deterministic ordering so identical inputs always produce identical output
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          echo "---"
          cat SHA256SUMS.txt

      - name: Verify stable updater artifact contract
        run: pnpm verify-update-artifacts
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Compose release notes body
        env:
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          {
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "## ❗ This is a pre-release"
              echo "- May contain bugs and unfinished features."
              echo ""
            fi
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      # Immutable-release repos forbid adding assets to an already-published
      # release, and action-gh-release publishes before uploading the assets.
      # Create the release as a draft (assets allowed), then promote it to a
      # published release in the next step.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2.6.2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote draft to published release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
