name: PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) does not affect the electron desktop build.
    # Skip the multi-platform installer build on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-on-pr-head:
    permissions:
      pull-requests: read
      actions: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Must be set before postinstall runs electron-rebuild
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'

      - name: Build application
        run: pnpm --filter inkiva build:app

      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm --filter inkiva package:mac:${{ matrix.arch }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm --filter inkiva package:win:${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkiva-${{ matrix.name }}
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    needs: run-on-pr-head
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
          - name: macos-x64
            os: macos-15-intel
            platform: macos
          - name: macos-arm64
            os: macos-15
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - name: Download packaged artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: inkiva-${{ matrix.name }}
          path: dist

      - name: Smoke Windows installer and ZIP
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/smokeWindowsPackage.ps1 dist

      - name: Smoke macOS DMG install and ZIP
        if: matrix.platform == 'macos'
        shell: bash
        run: bash scripts/smokeMacPackage.sh dist

  update-smoke:
    name: Updater artifact smoke
    needs: package-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: inkiva-*
          path: artifact-downloads

      - name: Assemble reused release artifacts
        run: pnpm tsx scripts/assembleReleaseArtifacts.ts artifact-downloads dist

      - name: Validate release assembly contracts
        run: pnpm test:release

      - name: Smoke updater artifact contract
        shell: bash
        run: |
          version="$(node -p "require('./packages/desktop/package.json').version")"
          GITHUB_REF_NAME="v${version}" pnpm verify-update-artifacts

  comment-on-pr:
    name: Comment artifact links on PR
    needs: run-on-pr-head
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Build comment body from artifacts
        id: build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run_id = context.runId;
            const pr_number = context.payload.pull_request.number;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id,
              per_page: 100
            });

            if (!data.artifacts.length) {
              core.setOutput('body', 'No artifacts were uploaded.');
            } else {
              const rows = data.artifacts.map(a => {
                const artifactPage = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}/artifacts/${a.id}`;
                const sizeMB = (a.size_in_bytes / 1024 / 1024).toFixed(1);
                return `| ${a.name} | ${sizeMB} MB | [Download](${artifactPage}) |`;
              }).join('\n');

              const body = [
                `Build artifacts for PR #${pr_number}:`,
                '',
                `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run_id}`,
                '',
                '| Artifact | Size | Link |',
                '|---|---:|---|',
                rows
              ].join('\n');

              core.setOutput('body', body);
            }

      - name: Find existing artifact comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: 'Build artifacts for PR'

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body: ${{ steps.build.outputs.body }}
          edit-mode: replace
