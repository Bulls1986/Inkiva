name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) self-lints via .github/workflows/muya-lint.yml.
    # Skip the desktop lint+typecheck on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'
      # Documentation-only PR updates do not need desktop build/test/E2E work.
      # Keep fixture Markdown outside these narrow documentation patterns.
      - 'docs/**'
      - '*.md'
      - '**/README.md'
      - '**/README.*.md'
      - '**/CHANGELOG.md'
      - '**/CHANGELOG.*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck
