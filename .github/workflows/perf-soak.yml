name: Performance Soak
# regressionPolicy: blocking — compare.ts is fail-closed for every lane.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/desktop/src/**'
      - 'packages/desktop/test/e2e/performance-trace.spec.ts'
      - 'packages/desktop/test/e2e/perf-04-large-document.spec.ts'
      - 'packages/desktop/test/e2e/performance-soak.spec.ts'
      - 'packages/desktop/test/performance/**'
      - 'packages/muya/src/**'
      - 'packages/muya/e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'perf/soak/**'
      - 'perf/gate/**'
      - '.github/workflows/perf-soak.yml'
  workflow_dispatch:
    inputs:
      bootstrap_baseline:
        description: 'Explicitly create a new Soak baseline when no baseline exists'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop @perf
    runs-on: ubuntu-24.04
    # Full scheduled/manual runs are eight hours; PRs use the explicit smoke mode.
    timeout-minutes: 510
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup

      - name: Validate performance policy
        run: pnpm test:perf:soak

      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Restore previous desktop baseline
        uses: actions/cache/restore@v4.2.4
        with:
          path: perf-baseline
          key: perf-soak-desktop-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-${{ github.sha }}
          restore-keys: |
            perf-soak-desktop-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-

      - name: Run desktop eight-hour soak lane
        id: perf
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            export INKIVA_PERF_SOAK_MODE=pr-smoke
          else
            export INKIVA_PERF_SOAK_MODE=full
          fi
          echo "Running desktop performance soak mode: ${INKIVA_PERF_SOAK_MODE}"
          xvfb-run --auto-servernum pnpm test:e2e:perf:soak
        env:
          INKIVA_PERF_CAPTURE: 'true'
          INKIVA_PERF_REPORT_DIR: ${{ github.workspace }}/packages/desktop/test-results/perf-results
          INKIVA_RUN_PERF: 'true'
          INKIVA_RUN_PERF_SOAK: 'true'
          INKIVA_PERF_SOAK_MODE: ${{ github.event_name == 'pull_request' && 'pr-smoke' || 'full' }}

      - name: Note desktop lane outcome
        if: always() && steps.perf.outcome != 'success'
        run: echo "::warning::Desktop @perf did not complete; the sample was uploaded and the previous baseline was kept."

      - name: Collect desktop performance metrics
        id: collect
        if: always()
        run: pnpm exec tsx perf/soak/collect.ts --suite desktop --input packages/desktop/test-results/perf-results --output perf-results/desktop.json

      - name: Compare desktop performance baseline
        id: compare
        if: always()
        run: |
          threshold_file=perf/soak/thresholds.json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            threshold_file=perf/soak/thresholds-pr-smoke.json
          fi
          pnpm exec tsx perf/soak/compare.ts --current perf-results/desktop.json --baseline perf-baseline/desktop.json --thresholds "$threshold_file" --output perf-results/desktop-comparison.json

      - name: Bootstrap desktop baseline (manual only)
        id: bootstrap
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bootstrap_baseline == true && steps.perf.outcome == 'success' && steps.collect.outcome == 'success' && steps.compare.outcome == 'failure'
        run: pnpm exec tsx perf/soak/bootstrap.ts --current perf-results/desktop.json --output perf-baseline/desktop.json

      - name: Stage desktop baseline
        if: always() && steps.collect.outcome == 'success' && (steps.compare.outcome == 'success' || steps.bootstrap.outcome == 'success')
        id: stage
        run: |
          if jq -e '.metrics | length > 0' perf-results/desktop.json >/dev/null; then
            mkdir -p perf-baseline
            cp perf-results/desktop.json perf-baseline/desktop.json
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No desktop performance metrics were collected."
            exit 1
          fi

      - name: Save desktop baseline
        if: always() && steps.collect.outcome == 'success' && steps.perf.outcome == 'success' && (steps.compare.outcome == 'success' || steps.bootstrap.outcome == 'success') && steps.stage.outputs.updated == 'true'
        uses: actions/cache/save@v4.2.4
        with:
          path: perf-baseline
          key: perf-soak-desktop-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-${{ github.sha }}

      - name: Upload desktop performance reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-performance-soak
          path: |
            perf-results/desktop.json
            perf-results/desktop-comparison.json
            packages/desktop/test-results/perf-results/
          if-no-files-found: error
          retention-days: 14

  muya:
    name: Muya @perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: ./.github/actions/setup

      - name: Restore previous Muya baseline
        uses: actions/cache/restore@v4.2.4
        with:
          path: perf-baseline
          key: perf-soak-muya-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-${{ github.sha }}
          restore-keys: |
            perf-soak-muya-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-

      - name: Install Playwright browser (chromium)
        run: pnpm -C packages/muya/e2e exec playwright install --with-deps chromium

      - name: Run Muya @perf lane
        id: perf
        run: pnpm -C packages/muya/e2e exec playwright test --project=chromium --grep "@perf"
        env:
          PERF_RESULTS_DIR: ${{ github.workspace }}/perf-results/muya

      - name: Collect Muya performance metrics
        id: collect
        if: always()
        run: pnpm exec tsx perf/soak/collect.ts --suite muya --input perf-results/muya --output perf-results/muya.json

      - name: Compare Muya performance baseline
        id: compare
        if: always()
        run: pnpm exec tsx perf/soak/compare.ts --current perf-results/muya.json --baseline perf-baseline/muya.json --thresholds perf/soak/thresholds-muya.json --output perf-results/muya-comparison.json

      - name: Bootstrap Muya baseline (manual only)
        id: bootstrap
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bootstrap_baseline == true && steps.perf.outcome == 'success' && steps.collect.outcome == 'success' && steps.compare.outcome == 'failure'
        run: pnpm exec tsx perf/soak/bootstrap.ts --current perf-results/muya.json --output perf-baseline/muya.json

      - name: Note Muya lane outcome
        if: always() && steps.perf.outcome != 'success'
        run: echo "::warning::Muya @perf did not complete; the sample was uploaded and the previous baseline was kept."

      - name: Stage Muya baseline
        if: always() && steps.collect.outcome == 'success' && (steps.compare.outcome == 'success' || steps.bootstrap.outcome == 'success')
        id: stage
        run: |
          if jq -e '.metrics | length > 0' perf-results/muya.json >/dev/null; then
            mkdir -p perf-baseline
            cp perf-results/muya.json perf-baseline/muya.json
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No Muya performance metrics were collected."
            exit 1
          fi

      - name: Save Muya baseline
        if: always() && steps.collect.outcome == 'success' && steps.perf.outcome == 'success' && (steps.compare.outcome == 'success' || steps.bootstrap.outcome == 'success') && steps.stage.outputs.updated == 'true'
        uses: actions/cache/save@v4.2.4
        with:
          path: perf-baseline
          key: perf-soak-muya-${{ runner.os }}-${{ hashFiles('perf/soak/schema.json', 'perf/soak/thresholds*.json', 'perf/soak/baseline-version.json') }}-${{ github.sha }}

      - name: Upload Muya performance reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: muya-performance-soak
          path: |
            perf-results/muya.json
            perf-results/muya-comparison.json
            packages/muya/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 14
