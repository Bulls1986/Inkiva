name: UI-14 Snapshot Bootstrap

on:
  push:
    branches:
      - codex/ui-14-visual-regression

permissions:
  contents: write

jobs:
  snapshots:
    if: ${{ !contains(github.event.head_commit.message, '[skip ui-14 snapshots]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup

      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Generate UI-14 visual snapshots
        run: >-
          xvfb-run --auto-servernum pnpm --filter inkiva exec playwright test
          test/e2e/visual-regression.spec.ts
          --config=test/e2e/playwright.config.ts
          --update-snapshots

      - name: Commit visual snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/desktop/test/e2e/visual-regression.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi
          git commit -m 'test(ui): add UI-14 visual baselines [skip ui-14 snapshots]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
