name: Temporary Lint Fix

on:
  push:
    branches:
      - ci/lint-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lint-fix
      - uses: ./.github/actions/setup
      - name: Apply ESLint fixes
        run: pnpm exec eslint --fix .
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No autofix changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "lint: apply eslint autofixes"
            git push origin HEAD:ci/lint-fix
          fi
      - name: Verify lint
        run: pnpm lint
