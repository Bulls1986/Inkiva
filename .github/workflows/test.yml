name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) has its own test workflows (muya-test, muya-spec).
    # Skip the desktop unit tests on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'
      # Documentation-only PR updates do not need desktop build/test/E2E work.
      # Keep fixture Markdown outside these narrow documentation patterns.
      - 'docs/**'
      - '*.md'
      - '**/README.md'
      - '**/README.*.md'
      - '**/CHANGELOG.md'
      - '**/CHANGELOG.*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run Website Unit Tests
        run: pnpm --filter inkiva-website test

      - name: Build Website
        env:
          INKIVA_RELEASE_VERSION_LABEL: v0.0.0-test
        run: pnpm --filter inkiva-website run build:static

      - name: Verify Website SEO Output
        run: pnpm --filter inkiva-website run verify:seo

      - name: Run Unit Tests
        run: pnpm test
